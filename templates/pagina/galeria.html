{% extends "layout.html" %}
{% block titulo %}Galería — Julio Flórez{% endblock %}
{% block contenido %}

<header class="encabezado-pagina">
  <div class="container">
    <h1>Galería</h1>
    <p>Momentos que capturan el espíritu de nuestra comunidad</p>
  </div>
</header>

<section>
  <div class="container">
    <div class="d-flex gap-2 flex-wrap mb-4">
      <button class="btn btn-sm rounded-pill btn-institucional">Todas</button>
      <button class="btn btn-sm rounded-pill btn-outline-institucional">Académico</button>
      <button class="btn btn-sm rounded-pill btn-outline-institucional">Cultural</button>
      <button class="btn btn-sm rounded-pill btn-outline-institucional">Deportivo</button>
      <button class="btn btn-sm rounded-pill btn-outline-institucional">Institucional</button>
      <button class="btn btn-sm rounded-pill btn-outline-institucional">Especialidades</button>
      <button class="btn btn-sm rounded-pill btn-outline-institucional">Bienestar</button>
    </div>

    <div class="row g-3">
      {% for foto in galeria %}
      <div class="col-6 col-md-3">
        <img src="{{ url_for('static', filename=foto) }}" class="img-fluid rounded-3 w-100"
          style="height:180px;object-fit:cover" alt="Foto de galería">
      </div>
      {% endfor %}
    </div>
  </div>
</section>

{% endblock %}
