<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — Panel Julio Flórez</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='Styles/main.css') }}">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='images/escudo.png') }}" height="56" alt="" onerror="this.style.display='none'">
      <h1 class="h5 mt-2 mb-0 font-titulo">Instituto Técnico Distrital<br>Julio Flórez</h1>
      <p class="text-muted small">Panel Administrativo</p>
    </div>

    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% if mensajes %}
        {% for categoria, mensaje in mensajes %}
        <div class="alert alert-{{ 'danger' if categoria=='error' else 'success' }} rounded-3 small">{{ mensaje }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin_login') }}">
      <label class="form-label small fw-semibold">Usuario</label>
      <input type="text" name="usuario" class="form-control mb-3" required autofocus>
      <label class="form-label small fw-semibold">Contraseña</label>
      <input type="password" name="password" class="form-control mb-4" required>
      <button type="submit" class="btn-institucional w-100">Ingresar</button>
    </form>
    <p class="text-center small text-muted mt-3 mb-0">
      <a href="{{ url_for('inicio') }}" class="text-verde">← Volver al sitio</a>
    </p>
  </div>
</div>
</body>
</html>
